<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — 페이지를 찾을 수 없습니다</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Noto+Sans+KR:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #13161d;
      --text: #edebe3;
      --muted: #a3a8b0;
      --faint: #737a84;
      --accent: #4fd1c0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text);
      font-family: 'Noto Sans KR', sans-serif; line-height: 1.8;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { color: #8ce3d6; text-decoration: underline; }
    .wrap { max-width: 760px; padding: 0 22px; text-align: center; }
    .code { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--faint); }
    h1 { font-family: 'Sora', 'Noto Sans KR', sans-serif; font-size: 32px; margin: 10px 0 0; }
    p { font-size: 15px; color: var(--muted); margin: 14px 0 0; }
    .links { font-size: 14px; color: var(--muted); margin-top: 24px; }
    @media (max-width: 640px) { h1 { font-size: 24px; } p { font-size: 14px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">404 NOT FOUND</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지입니다.</p>
    <div class="links"><a href="/">← 홈으로</a> · <a href="https://newbiecs.tistory.com/">기술 블로그</a></div>
  </main>
</body>
</html>
